name: Test cPanel API (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe cPanel UAPI
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPO_ROOT: /home/adtalk/repositories/AdTalkEvents
        run: |
          set +e
          AUTH="cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}"
          BASE="https://${CPANEL_HOST}:2083/execute"

          probe() {
            local label="$1"; shift
            echo "############################################"
            echo "# ${label}"
            echo "############################################"
            RAW=$(curl -sS -H "Authorization: ${AUTH}" "$@")
            CURL_EXIT=$?
            echo "curl exit code: ${CURL_EXIT}"
            echo "raw response:"
            echo "${RAW}"
            echo "parsed:"
            echo "${RAW}" | jq . 2>/dev/null || echo "(not valid JSON -- see raw response above)"
            echo ""
          }

          probe "VersionControl/create_deployment" --get "${BASE}/VersionControl/create_deployment" --data-urlencode "repository_root=${REPO_ROOT}"
          probe "VersionControl/deployment_create" --get "${BASE}/VersionControl/deployment_create" --data-urlencode "repository_root=${REPO_ROOT}"
          probe "VersionControl/deploy_head_commit" --get "${BASE}/VersionControl/deploy_head_commit" --data-urlencode "repository_root=${REPO_ROOT}"
          probe "VersionControl/run_deployment" --get "${BASE}/VersionControl/run_deployment" --data-urlencode "repository_root=${REPO_ROOT}"
          probe "VersionControlDeployment/create" --get "${BASE}/VersionControlDeployment/create" --data-urlencode "repository_root=${REPO_ROOT}"

          echo "Done reading all probes above."
          exit 0
