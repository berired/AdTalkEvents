name: Test cPanel API (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Update, deploy, and read the deployment log
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPO_ROOT: /home/adtalk/repositories/AdTalkEvents
        run: |
          set +e
          AUTH="cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}"
          BASE="https://${CPANEL_HOST}:2083/execute"

          echo "== VersionControl/update =="
          UPDATE_RAW=$(curl -sS -H "Authorization: ${AUTH}" \
            --get "${BASE}/VersionControl/update" \
            --data-urlencode "repository_root=${REPO_ROOT}" \
            --data-urlencode "branch=master")
          echo "${UPDATE_RAW}" | jq .

          echo ""
          echo "== VersionControlDeployment/create =="
          DEPLOY_RAW=$(curl -sS -H "Authorization: ${AUTH}" \
            --get "${BASE}/VersionControlDeployment/create" \
            --data-urlencode "repository_root=${REPO_ROOT}")
          echo "${DEPLOY_RAW}" | jq .

          LOG_PATH=$(echo "${DEPLOY_RAW}" | jq -r '.data.log_path')
          echo "Deployment log path: ${LOG_PATH}"

          echo ""
          echo "Waiting 45s for the build to finish (npm ci + vite build can take a while)..."
          sleep 45

          LOG_DIR=$(dirname "${LOG_PATH}")
          LOG_FILE=$(basename "${LOG_PATH}")
          echo "== Fileman/get_file_content (deployment log) =="
          LOGCONTENT_RAW=$(curl -sS -H "Authorization: ${AUTH}" \
            --get "${BASE}/Fileman/get_file_content" \
            --data-urlencode "dir=${LOG_DIR}" \
            --data-urlencode "file=${LOG_FILE}")
          echo "${LOGCONTENT_RAW}" | jq -r '.data.content'

          echo ""
          echo "== Fileman/get_file_content (memory diag) =="
          MEMDIAG_RAW=$(curl -sS -H "Authorization: ${AUTH}" \
            --get "${BASE}/Fileman/get_file_content" \
            --data-urlencode "dir=/home/adtalk" \
            --data-urlencode "file=deploy-diag.log")
          echo "${MEMDIAG_RAW}" | jq -r '.data.content'

          exit 0
