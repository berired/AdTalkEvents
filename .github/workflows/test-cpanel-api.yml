name: Test cPanel API (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe cPanel UAPI
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPO_ROOT: /home/adtalk/repositories/AdTalkEvents
        run: |
          set +e
          AUTH="cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}"
          BASE="https://${CPANEL_HOST}:2083/execute"

          probe() {
            local label="$1"; shift
            echo "############################################"
            echo "# ${label}"
            echo "############################################"
            RAW=$(curl -sS -H "Authorization: ${AUTH}" "$@")
            CURL_EXIT=$?
            echo "curl exit code: ${CURL_EXIT}"
            echo "raw response:"
            echo "${RAW}"
            echo "parsed:"
            echo "${RAW}" | jq . 2>/dev/null || echo "(not valid JSON -- see raw response above)"
            echo ""
          }

          probe "Fileman/get_file_content (deploy log)" --get "${BASE}/Fileman/get_file_content" --data-urlencode "dir=/home/adtalk/.cpanel/logs" --data-urlencode "file=vc_1790163354.86944_git_deploy.log"
          probe "VersionControl/update (recheck tasks)" --get "${BASE}/VersionControl/update" --data-urlencode "repository_root=${REPO_ROOT}" --data-urlencode "branch=master"

          echo "Done reading all probes above."
          exit 0
