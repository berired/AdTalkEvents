name: Test cPanel API (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe cPanel UAPI
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPO_ROOT: /home/adtalk/repositories/AdTalkEvents
        run: |
          AUTH="cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}"
          BASE="https://${CPANEL_HOST}:2083/execute"

          echo "############################################"
          echo "# 0. Baseline auth check (near-universal module)"
          echo "############################################"
          curl -sS -H "Authorization: ${AUTH}" \
            "${BASE}/Variables/get_user_information" | jq .

          echo ""
          echo "############################################"
          echo "# 1. Git/update"
          echo "############################################"
          curl -sS -H "Authorization: ${AUTH}" \
            --get "${BASE}/Git/update" \
            --data-urlencode "repository_root=${REPO_ROOT}" | jq .

          echo ""
          echo "############################################"
          echo "# 2. VersionControl/update"
          echo "############################################"
          curl -sS -H "Authorization: ${AUTH}" \
            --get "${BASE}/VersionControl/update" \
            --data-urlencode "repository_root=${REPO_ROOT}" | jq .

          echo ""
          echo "############################################"
          echo "# 3. VersionControl/deploy"
          echo "############################################"
          curl -sS -H "Authorization: ${AUTH}" \
            --get "${BASE}/VersionControl/deploy" \
            --data-urlencode "repository_root=${REPO_ROOT}" | jq .

          echo ""
          echo "Done. None of these steps fail the job on purpose -- read the JSON above."
